defaults:
    - override hydra/launcher: submitit_local
    - _self_

# environment
task: cheetah-run
obs: rgb
episodic: false

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 5000

# training
steps: 350_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
pi_coef: 0.11
ortho_reg_coef: 0.005
ortho_reg: false
full_rank_reg: false
full_rank_reg_coef: 0.005
full_rank_reg_num_samples: 128  # Number of observation samples for full rank regularization
collapse_prevention: true  # enable/disable random-function predictor mechanism
collapse_prevention_dim: 64
collapse_prevention_coef: 1
scale_factor: 1.0
rho: 0.5
lr: 3e-4 #was 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 200
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
q_sample_ratio: 1.0  # Ratio of buffer data visible to Q-function and collapse prevention training (0.0-1.0)
exp_name: RANKME_64_1
data_dir: ???
JEPA_sg: false
grad_from_Q: false
grad_from_R: false
grad_from_policy: false

# misc
compile: false
save_video: false
save_agent: true
seed: 2018
monitor_freq: 5000
full_rank: false
simnorm: false
simnorm_dim: 8
save_obs_for_rankme: false
rankme_samples: 30_000

monitor_rankme: true
monitor_eval_reward: true
monitor_jacobian_rank: true
monitor_encoding_space: true

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01

# logging
wandb_project: ???
wandb_entity: ???
wandb_silent: false
enable_wandb: false
save_csv: true

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

# Hydra configuration to organize outputs by experiment name
hydra:
  job:
    chdir: false  # Don't change directory automatically
  run:
    dir: ./tdmpc2/logs/${task}/${seed}/${exp_name}  # Use same structure as work_dir
  sweep:
    dir: ./tdmpc2/logs/${task}
    subdir: ${seed}/${exp_name}
